<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orçamento - Aurale</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <h1>Simulação de Orçamento</h1>
      <form>
        <label for="salao" class="form-check-label"
          >Salão de Festas - R$ 1.500</label
        >
        <input
          type="checkbox"
          class="form-check-input"
          id="salao"
        /><br /><br />

        <label for="qtd-mesas" class="form-label">Quantidade de Mesas</label
        ><br />
        <input type="number" class="form-control" id="qtd-mesas" />
        <label for="qtd-cadeiras" class="form-label"
          >Quantidade de Cadeiras</label
        >
        <input type="number" class="form-control" id="qtd-cadeiras" /><br />
        <button class="btn btn-primary" type="button" id="btn-calcular">
          Calcular Orçamento
        </button>
        <h3 id="resultado">Total: R$ 0,00</h3>
        <button class="btn btn-primary" type="reset" id="btn-reset">Limpar</button>
      </form>
    </div>
    <script src = "js/orcamento.js">
    </script>
  </body>
</html>
